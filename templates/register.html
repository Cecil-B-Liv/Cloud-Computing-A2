<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Encore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="overlay-load" id="loading" aria-hidden="true"><div class="spinner"></div><p>Creating account&hellip;</p></div>
  <div class="auth">
    <div class="img-pane">
      <div class="v-glow"></div>
      <div class="disc"></div>
      <div class="caption">
        <h2>Join the rotation.</h2>
        <p>Create an account and start subscribing to tracks.</p>
      </div>
    </div>

    <div class="form-pane">
      <div class="brand"><span class="logo">&#9835;</span><span class="wm">Encore</span></div>
      <h1>Create account</h1>
      <p class="sub">It only takes a moment</p>

      {% if error %}<div class="error">{{ error }}</div>{% endif %}

      <form method="post" action="{{ url_for('register') }}">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="you@example.com" maxlength="254" required>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Your username" maxlength="40" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" maxlength="64" required>

        <button type="submit" class="cta">Register</button>
      </form>

      <p class="altline">Already have one? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
  </div>
  <script>
    var ov = document.getElementById('loading');
    document.querySelector('form').addEventListener('submit', function () { ov.classList.add('show'); });
  </script>
</body>
</html>
