# HTTPS (port 443) with a self-signed cert, proxying to gunicorn.
# Install to: /etc/apache2/sites-available/music-ssl.conf
<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/music-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/music-selfsigned.key

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog  ${APACHE_LOG_DIR}/music_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/music_ssl_access.log combined
</VirtualHost>
