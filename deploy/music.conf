# Apache reverse proxy: public port 80 -> gunicorn on 127.0.0.1:8000
# Install to: /etc/apache2/sites-available/music.conf
<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog  ${APACHE_LOG_DIR}/music_error.log
    CustomLog ${APACHE_LOG_DIR}/music_access.log combined
</VirtualHost>
